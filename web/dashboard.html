        <td style="font-family:monospace">${esc(s.id)}</td>
        <td>
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.alive ? '#55ff55' : '#ff5555'};margin-right:6px"></span>
          ${s.alive ? 'Running' : 'Dead'}
        </td>
        <td>${s.pid || '-'}</td>
        <td>
          ${s.alive ? `<button class="btn" style="background:#ff333333; color:#ff5555; padding:4px 8px; font-size:11px" onclick="killSession('${esc(s.id)}')">Kill</button>` : ''}
        </td>
      </tr>

  } catch(e) {
    tb.innerHTML = `<tr><td colspan="4" style="color:var(--error)">Error cargando workers: ${e.message}</td></tr>`;
  }

async function spawnSession() {
  const input   = document.getElementById('spawn-session-id');
  const roleEl  = document.getElementById('spawn-role');
  const sid     = input.value.trim();
  const role    = roleEl ? roleEl.value.trim() : '';
  if(!sid) return showToast('Ingresa un ID para la sesión', 'error');
  try {
    const body = {session_id: sid};
    if(role) body.role = role;
    const res = await fetch('/v1/sessions/spawn', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    const roleLabel = role ? ` [${role}]` : '';
    showToast(data.message ? data.message + roleLabel : 'Worker spawneado' + roleLabel, data.ok ? 'success' : 'error');
    if(data.ok) {
      input.value = '';
      if(roleEl) roleEl.value = '';
      loadActiveSessions();
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  }
}

async function killSession(sid) {
  if(!confirm(`¿Matar la sesión activa '${sid}'?`)) return;

    const res = await fetch('/v1/sessions/kill', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: sid})
    });
    const data = await res.json();
    showToast(data.message, data.ok ? 'success' : 'error');
    if(data.ok) loadActiveSessions();
  } catch(e) {
    showToast('Error al matar worker: ' + e.message, 'error');
  }
}

        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div>
            <span style="font-size:12px;color:var(--muted)">${esc(p.timestamp)} · Sesión: ${esc(p.session_id)}</span><br>
            <strong style="font-size:15px;color:var(--warning)">⚠️ ${esc(p.tool)}</strong>
          </div>
          <div style="display:flex;gap:8px">
            <button onclick="approveHITL('${esc(p.id)}')" style="padding:7px 16px;background:#10b981;border:none;color:#fff;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">✅ Aprobar</button>
            <button onclick="rejectHITL('${esc(p.id)}')" style="padding:7px 16px;background:#ef4444;border:none;color:#fff;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">❌ Rechazar</button>
          </div>
        </div>
        <pre style="background:var(--bg);border-radius:6px;padding:10px;font-size:11px;max-height:150px;overflow-y:auto;color:var(--text);font-family:'JetBrains Mono',monospace">${esc(JSON.stringify(p.arguments,null,2))}</pre>
      </div>
    `).join('');
  } catch(e) {
    if(listEl) listEl.innerHTML = `<div style="color:var(--error);padding:16px">Error: ${esc(e.message)}</div>`;
  }
}

async function approveHITL(aid) {
  try {
    const res = await fetch('/v1/hitl/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({approval_id: aid})});
    const data = await res.json();
    showToast(data.message || 'Aprobado', 'success');
    _hitlApproved++;
    const el = document.getElementById('hitl-approved-count');
    if(el) el.textContent = _hitlApproved;
    fetchHITLPending();
  } catch(e) { showToast('Error aprobando: ' + e.message, 'error'); }
}

async function rejectHITL(aid) {
  const reason = prompt('¿Motivar el rechazo? (opcional)');
  try {
    const res = await fetch('/v1/hitl/reject', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({approval_id: aid, reason: reason||''})});
    const data = await res.json();
    showToast(data.message || 'Rechazado', 'warning');
    _hitlRejected++;
    const el = document.getElementById('hitl-rejected-count');
    if(el) el.textContent = _hitlRejected;
    fetchHITLPending();
  } catch(e) { showToast('Error rechazando: ' + e.message, 'error'); }
}

// ── V10.4: Firecrawl ─────────────────────────────────────────────────────────
async function fetchFirecrawlHealth() {
  try {
    const res = await fetch('/v1/tools/firecrawl/health');
    const d = await res.json();
    const modeEl = document.getElementById('fc-mode');
    const keyEl  = document.getElementById('fc-key-status');
    if(modeEl) {
      modeEl.textContent = d.configured ? 'Firecrawl API' : 'Fallback HTML';
      modeEl.style.color = d.configured ? 'var(--success)' : 'var(--warning)';
    }
    if(keyEl) {
      keyEl.textContent = d.configured ? '✅ Configurada' : '❌ No configurada';
      keyEl.style.color = d.configured ? 'var(--success)' : 'var(--error)';
    }
  } catch(e) {}
}

async function runFirecrawl() {
  const urlEl  = document.getElementById('fc-url-input');
  const btn    = document.getElementById('fc-run-btn');
  const resBox = document.getElementById('fc-result-box');
  const resCon = document.getElementById('fc-result-content');
  const resTit = document.getElementById('fc-result-title');
  const srcBdg = document.getElementById('fc-source-badge');
  const url    = urlEl ? urlEl.value.trim() : '';
  if(!url) return showToast('Ingresa una URL válida', 'error');
  if(btn) { btn.disabled = true; btn.textContent = '⏳ Scrapeando...'; }
  try {
    const res = await fetch('/v1/tools/scrape', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if(resBox) resBox.style.display = 'block';
    if(data.ok) {
      if(resTit) resTit.textContent = data.title || url;
      if(resCon) resCon.textContent = data.content || '(sin contenido)';
      if(srcBdg) {
        srcBdg.textContent = data.source === 'firecrawl' ? 'Firecrawl API' : 'Fallback HTML';
        srcBdg.style.background = data.source === 'firecrawl' ? 'rgba(99,102,241,0.15)' : 'rgba(245,158,11,0.15)';
        srcBdg.style.color = data.source === 'firecrawl' ? 'var(--accent)' : 'var(--warning)';
        srcBdg.style.border = data.source === 'firecrawl' ? '1px solid rgba(99,102,241,0.4)' : '1px solid rgba(245,158,11,0.4)';
      }
      showToast('Scrape completado — ' + (data.content||'').length + ' chars', 'success');
    } else {
      if(resCon) resCon.textContent = data.error || 'Error desconocido';
      if(resTit) resTit.textContent = 'Error';
      showToast(data.error || 'Error scrapeando URL', 'error');
    }
  } catch(e) {
    showToast('Error de red: ' + e.message, 'error');
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = '🕷️ Scrape'; }
  }
}

function copyFirecrawlResult() {
  const el = document.getElementById('fc-result-content');
  if(!el) return;
  navigator.clipboard.writeText(el.textContent).then(() => showToast('Contenido copiado al portapapeles', 'success')).catch(() => showToast('No se pudo copiar', 'error'));
}

// ── V10.4: MCP Servers ───────────────────────────────────────────────────────
async function loadMCPServers() {
  const tb = document.getElementById('tb-mcp-servers');
  const countSpan = document.getElementById('mcp-active-count');
  if(!tb) return;
  try {
    const res = await fetch('/v1/mcp/status');
    const data = await res.json();
    if(countSpan) countSpan.textContent = data.count || 0;
    if(!data.mcp_servers || data.mcp_servers.length === 0) {
      tb.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted)">Sin servidores MCP conectados</td></tr>';
      return;
    }
    tb.innerHTML = data.mcp_servers.map(s => `
      <tr>
        <td style="font-weight:600">${esc(s.name)}</td>
        <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.connected ? 'var(--success)' : 'var(--error)'};margin-right:6px"></span>${s.connected ? 'Online' : 'Offline'}</td>
        <td>${s.tools.length} Tools</td>
        <td>${s.resources.length > 0 ? s.resources.map(r => `<button class="btn-icon" style="font-size:11px;padding:2px 8px;margin:2px" onclick="readMCPResource('${s.name}','${r.uri}')">${esc(r.name)}</button>`).join('') : '<span style="font-size:11px;color:var(--muted)">0 Resources</span>'}</td>
      </tr>
    `).join('');
  } catch(e) {
    tb.innerHTML = `<tr><td colspan="4" style="color:var(--error)">Error cargando MCP: ${e.message}</td></tr>`;
  }
}

async function readMCPResource(server, uri) {
  const viewer  = document.getElementById('mcp-resources-viewer');
  const title   = document.getElementById('mcp-viewer-title');
  const content = document.getElementById('mcp-resource-content');
  if(!viewer) return;
  viewer.style.display = 'block';
  if(title) title.textContent = `Leyendo: ${uri} (@${server})`;
  if(content) content.innerHTML = '<span class="spinner"></span> Obteniendo recurso...';
  try {
    const res = await fetch(`/v1/mcp/resource?server=${encodeURIComponent(server)}&uri=${encodeURIComponent(uri)}`);
    const data = await res.json();
    if(!content) return;
    if(data.error) {
      content.innerHTML = `<span style="color:var(--error)">${esc(data.error)}</span>`;
    } else {
      let textToShow = (data.contents && data.contents.length > 0 && data.contents[0].text) ? data.contents[0].text : JSON.stringify(data, null, 2);
      content.textContent = textToShow;
    }
  } catch(e) {
    if(content) content.innerHTML = `<span style="color:var(--error)">Error de red: ${e.message}</span>`;
  }
}

// ── V10.4: switchTab hook (sin colisión) ────────────────────────────────────
// Nos enganchamos SIN override doble: inspeccionamos el tab dentro del mismo hook.
// El _switchTabV10hooks se evalúa al final, garantizando que el switchTab original ya está definido.
(function() {
  const _orig = window.switchTab;
  if(typeof _orig !== 'function') return; // switchTab no definido aún — retry deferred
  window.switchTab = function(tab, el) {
    _orig(tab, el);
    if(tab === 'sessions') { loadActiveSessions(); }
    if(tab === 'mcp')      { loadMCPServers(); }
    if(tab === 'hitl')     { fetchHITLPending(); }
    if(tab === 'firecrawl'){ fetchFirecrawlHealth(); }
  };
})();

// Polling HITL: cada 8 segundos verifica si hay aprobaciones pendientes
setInterval(fetchHITLPending, 8000);
// Inicializar Firecrawl health si el panel ya está activo
document.addEventListener('DOMContentLoaded', () => {
  fetchHITLPending();
});

</script>
