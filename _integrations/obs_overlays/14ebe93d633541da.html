<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#fondo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000;
}

#barras {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.barra {
  width: 100%;
  height: 10px;
  background-color: #000;
  margin: 10px 0;
}

#humo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#contador {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 64px;
  font-family: Arial;
  color: #fff;
  text-align: center;
}

#mensaje {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 64px;
  font-family: Arial;
  color: #fff;
  text-align: center;
  opacity: 0;
}

@keyframes disipar {
  0% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

@keyframes aparecer {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}
</style>
</head>
<body>
<div id="fondo"></div>
<div id="barras">
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
</div>
<canvas id="humo" width="100%" height="100%"></canvas>
<div id="contador">10</div>
<div id="mensaje">SISTEMA ONLINE</div>
<script>
let contador = 10;
let intervalo;
let canvas = document.getElementById('humo');
let ctx = canvas.getContext('2d');
let ancho = canvas.width = window.innerWidth;
let alto = canvas.height = window.innerHeight;

function dibujarHumo() {
  ctx.clearRect(0, 0, ancho, alto);
  for (let i = 0; i < 100; i++) {
    let x = Math.random() * ancho;
    let y = Math.random() * alto;
    let radio = Math.random() * 10;
    ctx.beginPath();
    ctx.arc(x, y, radio, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fill();
  }
}

function actualizarContador() {
  contador--;
  document.getElementById('contador').innerHTML = contador;
  if (contador === 0) {
    clearInterval(intervalo);
    document.getElementById('humo').style.opacity = 0;
    document.getElementById('mensaje').style.opacity = 1;
  }
}

intervalo = setInterval(actualizarContador, 1000);
setInterval(dibujarHumo, 16);
</script>
</body>
</html>
