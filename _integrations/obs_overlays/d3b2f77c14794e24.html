<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.text {
  font-family: Arial;
  font-size: 48px;
  font-weight: bold;
  color: #ffd700;
  text-shadow: 0px 0px 10px #ffd700, 0px 0px 20px #ffd700, 0px 0px 30px #ffd700;
  animation: zoom 0.5s ease-out;
}

@keyframes zoom {
  0% {
    transform: scale(0.1);
  }
  100% {
    transform: scale(1);
  }
}

.canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

</style>
</head>
<body>
<div class="container">
  <div class="text" id="text">NUEVA DONACIÓN <span id="name"></span></div>
  <canvas class="canvas" id="canvas" width="100%" height="100%"></canvas>
</div>
<script>
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
let text = document.getElementById('text');
let name = document.getElementById('name');
let names = ['Juan', 'Maria', 'Pedro', 'Ana', 'Carlos'];
let particles = [];

function randomName() {
  return names[Math.floor(Math.random() * names.length)];
}

function createParticle(x, y) {
  let particle = {
    x: x,
    y: y,
    vx: Math.random() * 2 - 1,
    vy: Math.random() * 2 - 1,
    radius: Math.random() * 2 + 1,
    color: '#ffd700'
  };
  particles.push(particle);
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < particles.length; i++) {
    let particle = particles[i];
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.radius, 0, 2 * Math.PI);
    ctx.fillStyle = particle.color;
    ctx.fill();
    particle.x += particle.vx;
    particle.y += particle.vy;
    if (particle.x < 0 || particle.x > canvas.width || particle.y < 0 || particle.y > canvas.height) {
      particles.splice(i, 1);
    }
  }
}

function animation() {
  drawParticles();
  requestAnimationFrame(animation);
}

function donacion() {
  particles = [];
  for (let i = 0; i < 100; i++) {
    createParticle(canvas.width / 2, canvas.height / 2);
  }
  name.textContent = randomName();
  text.style.opacity = 1;
  setTimeout(() => {
    text.style.opacity = 0;
  }, 2000);
}

animation();
setInterval(donacion, 10000);
</script>
</html>
