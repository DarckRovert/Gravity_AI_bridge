<!DOCTYPE html>
<html>
<head>
  <title>Inicio Cinematográfico</title>
  <style>
    body {
      background-color: rgba(0,0,0,0);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .fondo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
    }
    .humo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .barras {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      opacity: 0.5;
    }
    .barras div {
      position: absolute;
      width: 10px;
      height: 100%;
      background-color: #000;
    }
    .cuenta-regresiva {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-family: Arial;
      color: #fff;
    }
    .texto-final {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      font-family: Arial;
      color: #fff;
      opacity: 0;
    }
    @keyframes aparecer {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    @keyframes desaparecer {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="fondo"></div>
  <canvas class="humo" width="100%" height="100%"></canvas>
  <div class="barras">
    <div style="left: 10%"></div>
    <div style="left: 30%"></div>
    <div style="left: 50%"></div>
    <div style="left: 70%"></div>
    <div style="left: 90%"></div>
  </div>
  <div class="cuenta-regresiva">10</div>
  <div class="texto-final">DARCKROVERT</div>
  <script>
    let canvas = document.querySelector('.humo');
    let ctx = canvas.getContext('2d');
    let cuentaRegresiva = document.querySelector('.cuenta-regresiva');
    let textoFinal = document.querySelector('.texto-final');
    let tiempo = 10;
    let intervalo;
    let humo = [];

    function generarHumo() {
      for (let i = 0; i < 100; i++) {
        humo.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: Math.random() * 2 - 1,
          vy: Math.random() * 2 - 1,
          radio: Math.random() * 10 + 5
        });
      }
    }

    function actualizarHumo() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < humo.length; i++) {
        let particula = humo[i];
        particula.x += particula.vx;
        particula.y += particula.vy;
        if (particula.x < 0 || particula.x > canvas.width) {
          particula.vx = -particula.vx;
        }
        if (particula.y < 0 || particula.y > canvas.height) {
          particula.vy = -particula.vy;
        }
        ctx.beginPath();
        ctx.arc(particula.x, particula.y, particula.radio, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fill();
      }
    }

    function cuentaRegresivaFuncion() {
      tiempo--;
      cuentaRegresiva.textContent = tiempo;
      if (tiempo <= 0) {
        clearInterval(intervalo);
        cuentaRegresiva.style.animation = 'desaparecer 1s';
        textoFinal.style.animation = 'aparecer 1s';
        textoFinal.style.opacity = 1;
        for (let i = 0; i < humo.length; i++) {
          humo[i].vx = 0;
          humo[i].vy = 0;
        }
      }
    }

    generarHumo();
    intervalo = setInterval(cuentaRegresivaFuncion, 1000);
    setInterval(actualizarHumo, 16);
  </script>
</body>
</html>
