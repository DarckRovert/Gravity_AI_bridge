<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#fondo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

#barras {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.barra {
  width: 100%;
  height: 10px;
  background-color: #000;
  margin: 10px 0;
}

#texto {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-family: Arial;
  color: #fff;
  opacity: 0;
  transition: opacity 1s;
}

#contador {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 96px;
  font-family: Arial;
  color: #fff;
  opacity: 1;
  transition: opacity 1s;
}

@keyframes aparecer {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

@keyframes desaparecer {
  0% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
</style>
</head>
<body>
<canvas id="fondo" width="100%" height="100%"></canvas>
<div id="barras">
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
  <div class="barra"></div>
</div>
<div id="texto">SISTEMA ONLINE</div>
<div id="contador">10</div>
<script>
let canvas = document.getElementById('fondo');
let ctx = canvas.getContext('2d');
let ancho = canvas.width = window.innerWidth;
let alto = canvas.height = window.innerHeight;
let contador = 10;
let texto = document.getElementById('texto');
let contadorElement = document.getElementById('contador');

function perlin(x, y, seed) {
  let rand = Math.sin(x * 12.9898 + y * 78.233 + seed * 53.539) * 43758.5453;
  return rand - Math.floor(rand);
}

function dibujarHumo() {
  ctx.clearRect(0, 0, ancho, alto);
  for (let x = 0; x < ancho; x++) {
    for (let y = 0; y < alto; y++) {
      let r = perlin(x / 100, y / 100, Date.now() / 1000);
      let g = perlin(x / 100 + 10, y / 100 + 10, Date.now() / 1000);
      let b = perlin(x / 100 + 20, y / 100 + 20, Date.now() / 1000);
      ctx.fillStyle = `rgba(${r * 128}, ${g * 128}, ${b * 128}, 0.5)`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

function actualizarContador() {
  contador--;
  contadorElement.textContent = contador;
  if (contador <= 0) {
    texto.style.opacity = 1;
    contadorElement.style.opacity = 0;
    texto.style.animation = 'aparecer 1s';
    contadorElement.style.animation = 'desaparecer 1s';
    clearInterval(intervalo);
  }
}

let intervalo = setInterval(actualizarContador, 1000);

function loop() {
  dibujarHumo();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
