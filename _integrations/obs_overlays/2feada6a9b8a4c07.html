<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000;
}

.humo {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.5);
}

.barra-cinematografica {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 20px;
  background-color: #000;
  z-index: 1;
}

.barra-cinematografica-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 20px;
  background-color: #000;
  z-index: 1;
}

.cuenta-regresiva {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 64px;
  font-family: Arial;
  color: #fff;
  z-index: 2;
}

.sistema-online {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 64px;
  font-family: Arial;
  color: #fff;
  z-index: 2;
  opacity: 0;
}

@keyframes disipar-humo {
  0% {
    opacity: 0.5;
  }
  100% {
    opacity: 0;
  }
}

@keyframes mostrar-sistema-online {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="humo"></div>
  <div class="barra-cinematografica"></div>
  <div class="barra-cinematografica-bottom"></div>
  <div class="cuenta-regresiva" id="cuenta-regresiva">10</div>
  <div class="sistema-online" id="sistema-online">SISTEMA ONLINE</div>
  <canvas id="canvas" width="100%" height="100%"></canvas>
</div>
<script>
let cuentaRegresiva = 10;
let humo = document.querySelector('.humo');
let sistemaOnline = document.querySelector('#sistema-online');

function disiparHumo() {
  humo.style.animation = 'disipar-humo 2s forwards';
  sistemaOnline.style.animation = 'mostrar-sistema-online 2s forwards';
}

function actualizarCuentaRegresiva() {
  if (cuentaRegresiva > 0) {
    cuentaRegresiva--;
    document.querySelector('#cuenta-regresiva').innerHTML = cuentaRegresiva;
  } else {
    disiparHumo();
  }
}

setInterval(actualizarCuentaRegresiva, 1000);

let canvas = document.querySelector('#canvas');
let ctx = canvas.getContext('2d');
let width = canvas.width;
let height = canvas.height;

function perlinNoise(x, y, seed) {
  let random = Math.sin((x * 12.9898 + y * 78.233) * seed);
  return random;
}

function generarHumo() {
  ctx.clearRect(0, 0, width, height);
  for (let x = 0; x < width; x++) {
    for (let y = 0; y < height; y++) {
      let noise = perlinNoise(x / 10, y / 10, 0.01);
      let alpha = Math.abs(noise) * 0.5;
      ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

generarHumo();
setInterval(generarHumo, 100);
</script>
</body>
</html>
