<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#hud {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-family: monospace;
  color: #00FF00;
}

#hora {
  font-size: 36px;
  margin-bottom: 20px;
}

#sistema {
  margin-top: 20px;
}

#cpu, #ram {
  width: 100px;
  height: 20px;
  border: 1px solid #00FF00;
  border-radius: 5px;
  background-color: #000;
  position: relative;
}

#cpu-bar, #ram-bar {
  height: 100%;
  background-color: #00FF00;
  border-radius: 5px;
  transition: width 0.5s;
}

#radar {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #00FF00;
  animation: rotar 5s linear infinite;
}

@keyframes rotar {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}
</style>
</head>
<body>
<div id="hud">
  <div id="hora"></div>
  <div id="sistema">
    <div id="cpu">
      <div id="cpu-bar"></div>
      <span>CPU: <span id="cpu-text">0%</span></span>
    </div>
    <div id="ram">
      <div id="ram-bar"></div>
      <span>RAM: <span id="ram-text">0%</span></span>
    </div>
  </div>
  <div id="radar"></div>
</div>
<script>
let hora = document.getElementById('hora');
let cpuBar = document.getElementById('cpu-bar');
let cpuText = document.getElementById('cpu-text');
let ramBar = document.getElementById('ram-bar');
let ramText = document.getElementById('ram-text');

setInterval(() => {
  let date = new Date();
  let hours = date.getHours().toString().padStart(2, '0');
  let minutes = date.getMinutes().toString().padStart(2, '0');
  let seconds = date.getSeconds().toString().padStart(2, '0');
  hora.textContent = `${hours}:${minutes}:${seconds}`;
  
  let cpu = Math.floor(Math.random() * 100);
  cpuBar.style.width = `${cpu}%`;
  cpuText.textContent = `${cpu}%`;
  
  let ram = Math.floor(Math.random() * 100);
  ramBar.style.width = `${ram}%`;
  ramText.textContent = `${ram}%`;
}, 1000);
</script>
</body>
</html>
