<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.neon-text {
  font-family: monospace;
  font-size: 36px;
  color: #00ff00;
  text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
  animation: neon-pulse 2s infinite;
}

@keyframes neon-pulse {
  0% {
    text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
  }
  50% {
    text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00, 0 0 40px #00ff00;
  }
  100% {
    text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
  }
}

.creditos {
  font-family: Arial;
  font-size: 18px;
  color: #ffffff;
  position: absolute;
  bottom: 10px;
  left: 10px;
  animation: creditos-aparicion 2s;
}

@keyframes creditos-aparicion {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

.datos-dinamicos {
  font-family: Verdana;
  font-size: 24px;
  color: #ffffff;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: datos-dinamicos-rotacion 5s infinite;
}

@keyframes datos-dinamicos-rotacion {
  0% {
    transform: translate(-50%, -50%) rotate(0deg);
  }
  100% {
    transform: translate(-50%, -50%) rotate(360deg);
  }
}
</style>
</head>
<body>
<div class="neon-text">Bienvenidos a Gravity...</div>
<div class="creditos">Programa libre creado por DarckRovert para acortar la brecha tecnológica.</div>
<div class="datos-dinamicos" id="datos-dinamicos"></div>
<script>
let datosDinamicos = ["Conectados: 100", "Seguidores: 500", "Me gusta: 2000"];
let indice = 0;
setInterval(() => {
  document.getElementById("datos-dinamicos").innerHTML = datosDinamicos[indice];
  indice = (indice + 1) % datosDinamicos.length;
}, 2000);
</script>
</body>
</html>
