<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.texto {
  font-family: Arial;
  font-size: 36px;
  font-weight: bold;
  color: #ffd700;
  text-shadow: 2px 2px 4px #000;
  animation: zoom 0.5s ease-out;
}

@keyframes zoom {
  0% {
    transform: scale(0.1);
  }
  100% {
    transform: scale(1);
  }
}

.canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

</style>
</head>
<body>
<canvas class="canvas" id="canvas" width="400" height="200"></canvas>
<div class="container">
  <div class="texto" id="texto">NUEVA DONACIÓN</div>
  <div id="nombre"></div>
</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const texto = document.getElementById('texto');
  const nombre = document.getElementById('nombre');

  let particulas = [];
  let nombres = ['Juan', 'Pedro', 'Maria', 'Luis', 'Ana'];
  let nombreActual = '';

  function crearParticula(x, y) {
    particulas.push({
      x: x,
      y: y,
      vx: Math.random() * 2 - 1,
      vy: Math.random() * 2 - 1,
      radio: Math.random() * 2 + 1,
      color: '#ffd700'
    });
  }

  function actualizarParticulas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particulas.length; i++) {
      let particula = particulas[i];
      particula.x += particula.vx;
      particula.y += particula.vy;
      ctx.beginPath();
      ctx.arc(particula.x, particula.y, particula.radio, 0, 2 * Math.PI);
      ctx.fillStyle = particula.color;
      ctx.fill();
      if (particula.x < 0 || particula.x > canvas.width || particula.y < 0 || particula.y > canvas.height) {
        particulas.splice(i, 1);
      }
    }
  }

  function explosion() {
    for (let i = 0; i < 100; i++) {
      crearParticula(canvas.width / 2, canvas.height / 2);
    }
    texto.style.display = 'block';
    nombreActual = nombres[Math.floor(Math.random() * nombres.length)];
    nombre.textContent = nombreActual;
    nombre.style.display = 'block';
    function animar() {
      actualizarParticulas();
      if (particulas.length === 0) {
        texto.style.display = 'none';
        nombre.style.display = 'none';
        return;
      }
      requestAnimationFrame(animar);
    }
    animar();
  }

  setInterval(explosion, 10000);
  explosion();
</script>
</html>
