<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
#canvas {
  width: 100%;
  height: 100%;
}
.reloj {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 24px;
  font-family: monospace;
  color: #00ff00;
}
.recursos {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-size: 18px;
  font-family: monospace;
  color: #00ff00;
}
</style>
</head>
<body>
<div class="canvas-container">
<canvas id="canvas"></canvas>
<div class="reloj" id="reloj">00:00:00</div>
<div class="recursos" id="recursos">CPU: 0% | MEM: 0%</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}';
let gotas = [];
let palabras = ['SECURE', 'FIREWALL', 'DARCKROVERT', 'GRAVITY'];
let palabraActual = '';
let monitoreoActivo = false;
let reloj = document.getElementById('reloj');
let recursos = document.getElementById('recursos');
let cpu = 0;
let mem = 0;

function generarGota() {
  let x = Math.random() * canvas.width;
  let y = Math.random() * canvas.height;
  let velocidad = Math.random() * 2 + 1;
  let caracter = caracteres[Math.floor(Math.random() * caracteres.length)];
  gotas.push({x, y, velocidad, caracter});
}

function actualizarGota(gota) {
  gota.y += gota.velocidad;
  if (gota.y > canvas.height) {
    gota.y = 0;
    gota.x = Math.random() * canvas.width;
  }
}

function dibujarGota(gota) {
  ctx.font = '24px monospace';
  ctx.fillStyle = '#00ff00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(gota.caracter, gota.x, gota.y);
}

function generarPalabra() {
  palabraActual = palabras[Math.floor(Math.random() * palabras.length)];
  let x = Math.random() * (canvas.width - palabraActual.length * 24);
  let y = Math.random() * (canvas.height - 24);
  for (let i = 0; i < palabraActual.length; i++) {
    let gota = {
      x: x + i * 24,
      y: y,
      velocidad: Math.random() * 2 + 1,
      caracter: palabraActual[i]
    };
    gotas.push(gota);
  }
}

function actualizarReloj() {
  let fecha = new Date();
  let hora = fecha.getHours().toString().padStart(2, '0');
  let minutos = fecha.getMinutes().toString().padStart(2, '0');
  let segundos = fecha.getSeconds().toString().padStart(2, '0');
  reloj.textContent = `${hora}:${minutos}:${segundos}`;
}

function actualizarRecursos() {
  cpu = Math.random() * 100;
  mem = Math.random() * 100;
  recursos.textContent = `CPU: ${cpu.toFixed(2)}% | MEM: ${mem.toFixed(2)}%`;
}

function detectarMonitoreo() {
  monitoreoActivo = Math.random() < 0.1;
  if (monitoreoActivo) {
    for (let i = 0; i < gotas.length; i++) {
      gotas[i].velocidad = Math.random() * 5 + 1;
    }
  } else {
    for (let i = 0; i < gotas.length; i++) {
      gotas[i].velocidad = Math.random() * 2 + 1;
    }
  }
}

function animar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < gotas.length; i++) {
    actualizarGota(gotas[i]);
    dibujarGota(gotas[i]);
  }
  if (Math.random() < 0.01) {
    generarPalabra();
  }
  if (Math.random() < 0.1) {
    detectarMonitoreo();
  }
  actualizarReloj();
  actualizarRecursos();
  requestAnimationFrame(animar);
}

for (let i = 0; i < 100; i++) {
  generarGota();
}

animar();
</script>
</body>
</html>
