<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.canvas {
  width: 100%;
  height: 100%;
}

.countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-family: Arial;
  color: #ffffff;
  text-align: center;
}

.online-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 48px;
  font-family: Arial;
  color: #ffffff;
  text-align: center;
  opacity: 0;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes fadeOut {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}

.bars {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000000;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.bar {
  width: 100%;
  height: 10px;
  background-color: #000000;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {
    transform: scaleY(1);
  }
  50% {
    transform: scaleY(1.5);
  }
  100% {
    transform: scaleY(1);
  }
}
</style>
</head>
<body>
<div class="canvas-container">
  <canvas class="canvas" id="canvas"></canvas>
</div>
<div class="countdown" id="countdown">10</div>
<div class="online-text" id="online-text">SISTEMA ONLINE</div>
<div class="bars">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>
<script>
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let countdown = document.getElementById('countdown');
let onlineText = document.getElementById('online-text');

let time = 10;
let intervalId = setInterval(() => {
  time--;
  countdown.textContent = time;
  if (time === 0) {
    clearInterval(intervalId);
    onlineText.style.opacity = 1;
    onlineText.style.animation = 'fadeIn 2s';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}, 1000);

function drawNoise() {
  for (let i = 0; i < canvas.width; i++) {
    for (let j = 0; j < canvas.height; j++) {
      let noise = Math.random() * 255;
      ctx.fillStyle = `rgba(${noise}, ${noise}, ${noise}, 0.1)`;
      ctx.fillRect(i, j, 1, 1);
    }
  }
}

setInterval(drawNoise, 16);

function drawBars() {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, 10);
  ctx.fillRect(0, canvas.height - 10, canvas.width, 10);
}

setInterval(drawBars, 16);
</script>
</body>
</html>
