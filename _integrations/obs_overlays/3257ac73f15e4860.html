<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
.canvas {
  width: 100%;
  height: 100%;
}
.info-container {
  position: absolute;
  top: 10px;
  left: 10px;
  font-family: monospace;
  font-size: 16px;
  color: #00ff00;
}
.info-container .reloj {
  font-size: 24px;
}
.info-container .recursos {
  font-size: 18px;
}
</style>
</head>
<body>
<div class="canvas-container">
<canvas class="canvas"></canvas>
</div>
<div class="info-container">
<div class="reloj" id="reloj"></div>
<div class="recursos" id="recursos"></div>
</div>
<script>
const canvas = document.querySelector('.canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890';
let gotas = [];
let palabras = ['SECURE', 'FIREWALL', 'DARCKROVERT', 'GRAVITY'];
let monitoreoActivo = false;
let recursos = {
  cpu: 0,
  memoria: 0,
  disco: 0
};
let reloj = document.getElementById('reloj');
let recursosElement = document.getElementById('recursos');

function actualizarReloj() {
  let fecha = new Date();
  let hora = fecha.getHours() + ':' + fecha.getMinutes() + ':' + fecha.getSeconds();
  reloj.textContent = hora;
}
setInterval(actualizarReloj, 1000);

function actualizarRecursos() {
  recursos.cpu = Math.floor(Math.random() * 100);
  recursos.memoria = Math.floor(Math.random() * 100);
  recursos.disco = Math.floor(Math.random() * 100);
  recursosElement.textContent = `CPU: ${recursos.cpu}% - Memoria: ${recursos.memoria}% - Disco: ${recursos.disco}%`;
}
setInterval(actualizarRecursos, 1000);

function crearGota() {
  let x = Math.floor(Math.random() * canvas.width);
  let y = Math.floor(Math.random() * canvas.height);
  let velocidadX = Math.floor(Math.random() * 2) - 1;
  let velocidadY = Math.floor(Math.random() * 2) - 1;
  let caracter = caracteres[Math.floor(Math.random() * caracteres.length)];
  gotas.push({ x, y, velocidadX, velocidadY, caracter });
}

function actualizarGota(gota) {
  gota.x += gota.velocidadX;
  gota.y += gota.velocidadY;
  if (gota.x < 0 || gota.x > canvas.width) {
    gota.velocidadX *= -1;
  }
  if (gota.y < 0 || gota.y > canvas.height) {
    gota.velocidadY *= -1;
  }
  if (monitoreoActivo) {
    gota.velocidadX *= 1.1;
    gota.velocidadY *= 1.1;
  }
}

function dibujarGota(gota) {
  ctx.font = '24px monospace';
  ctx.fillStyle = '#00ff00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(gota.caracter, gota.x, gota.y);
}

function crearPalabra(palabra) {
  let x = Math.floor(Math.random() * canvas.width);
  let y = Math.floor(Math.random() * canvas.height);
  let velocidadX = Math.floor(Math.random() * 2) - 1;
  let velocidadY = Math.floor(Math.random() * 2) - 1;
  let caracteres = palabra.split('');
  gotas.push({ x, y, velocidadX, velocidadY, caracteres });
}

function actualizarPalabra(gota) {
  gota.x += gota.velocidadX;
  gota.y += gota.velocidadY;
  if (gota.x < 0 || gota.x > canvas.width) {
    gota.velocidadX *= -1;
  }
  if (gota.y < 0 || gota.y > canvas.height) {
    gota.velocidadY *= -1;
  }
  if (monitoreoActivo) {
    gota.velocidadX *= 1.1;
    gota.velocidadY *= 1.1;
  }
}

function dibujarPalabra(gota) {
  ctx.font = '24px monospace';
  ctx.fillStyle = '#00ff00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let texto = '';
  for (let i = 0; i < gota.caracteres.length; i++) {
    texto += gota.caracteres[i];
  }
  ctx.fillText(texto, gota.x, gota.y);
}

function animar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < gotas.length; i++) {
    if (gotas[i].caracter) {
      actualizarGota(gotas[i]);
      dibujarGota(gotas[i]);
    } else {
      actualizarPalabra(gotas[i]);
      dibujarPalabra(gotas[i]);
    }
  }
  if (Math.random() < 0.1) {
    crearGota();
  }
  if (Math.random() < 0.01) {
    let palabra = palabras[Math.floor(Math.random() * palabras.length)];
    crearPalabra(palabra);
  }
  if (Math.random() < 0.001) {
    monitoreoActivo = true;
  } else if (monitoreoActivo && Math.random() < 0.1) {
    monitoreoActivo = false;
  }
  requestAnimationFrame
