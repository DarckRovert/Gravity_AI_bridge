<!DOCTYPE html>
<html>
<head>
  <title>Widget HUD</title>
  <style>
    body {
      background-color: rgba(0,0,0,0);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #hud {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #0f0;
      font-family: monospace;
    }
    #hud #hora {
      font-size: 24px;
      position: absolute;
      top: 10px;
      left: 10px;
    }
    #hud #monitor {
      position: absolute;
      top: 50px;
      left: 10px;
    }
    #hud #monitor #cpu {
      font-size: 18px;
    }
    #hud #monitor #ram {
      font-size: 18px;
    }
    #hud #monitor .barra {
      width: 100px;
      height: 10px;
      background-color: #333;
      border: 1px solid #0f0;
    }
    #hud #monitor .barra .progreso {
      height: 10px;
      background-color: #0f0;
    }
    #hud #radar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #hud #radar #rotulo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1px solid #0f0;
      animation: rotar 5s linear infinite;
    }
    @keyframes rotar {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hora"></div>
    <div id="monitor">
      <div id="cpu">CPU: <span id="cpu-porcentaje"></span>%</div>
      <div class="barra">
        <div class="progreso" id="cpu-barra" style="width: 0%"></div>
      </div>
      <div id="ram">RAM: <span id="ram-porcentaje"></span>%</div>
      <div class="barra">
        <div class="progreso" id="ram-barra" style="width: 0%"></div>
      </div>
    </div>
    <div id="radar">
      <div id="rotulo"></div>
    </div>
  </div>
  <script>
    let hora = document.getElementById('hora');
    let cpuPorcentaje = document.getElementById('cpu-porcentaje');
    let cpuBarra = document.getElementById('cpu-barra');
    let ramPorcentaje = document.getElementById('ram-porcentaje');
    let ramBarra = document.getElementById('ram-barra');

    function actualizarHora() {
      let fecha = new Date();
      let horas = fecha.getHours().toString().padStart(2, '0');
      let minutos = fecha.getMinutes().toString().padStart(2, '0');
      let segundos = fecha.getSeconds().toString().padStart(2, '0');
      hora.textContent = `${horas}:${minutos}:${segundos}`;
    }

    function actualizarMonitor() {
      let cpu = Math.floor(Math.random() * 100);
      let ram = Math.floor(Math.random() * 100);
      cpuPorcentaje.textContent = cpu;
      cpuBarra.style.width = `${cpu}%`;
      ramPorcentaje.textContent = ram;
      ramBarra.style.width = `${ram}%`;
    }

    setInterval(actualizarHora, 1000);
    setInterval(actualizarMonitor, 1000);
  </script>
</html>
