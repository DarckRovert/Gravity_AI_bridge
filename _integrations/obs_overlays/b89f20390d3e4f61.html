<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: rgba(0,0,0,0);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #contenedor {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #humo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #cuenta-regresiva {
      font-size: 64px;
      font-family: Arial;
      color: #fff;
      text-align: center;
    }
    #sistema-online {
      font-size: 64px;
      font-family: Arial;
      color: #fff;
      text-align: center;
      opacity: 0;
    }
    .barra-cinematografica {
      position: absolute;
      width: 100%;
      height: 10px;
      background-color: #000;
    }
    .barra-cinematografica.top {
      top: 0;
    }
    .barra-cinematografica.bottom {
      bottom: 0;
    }
    @keyframes disipacion {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
    @keyframes revelacion {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="contenedor">
    <canvas id="humo" width="100%" height="100%"></canvas>
    <div id="cuenta-regresiva">10</div>
    <div id="sistema-online">SISTEMA ONLINE</div>
    <div class="barra-cinematografica top"></div>
    <div class="barra-cinematografica bottom"></div>
  </div>
  <script>
    let canvas = document.getElementById('humo');
    let ctx = canvas.getContext('2d');
    let cuentaRegresiva = document.getElementById('cuenta-regresiva');
    let sistemaOnline = document.getElementById('sistema-online');
    let tiempo = 10;
    let intervalo;
    let disipando = false;
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    function generarHumo() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < 100; i++) {
        let x = Math.random() * canvas.width;
        let y = Math.random() * canvas.height;
        let radio = Math.random() * 10;
        ctx.beginPath();
        ctx.arc(x, y, radio, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.fill();
      }
    }
    
    function cuentaRegresivaFuncion() {
      tiempo--;
      cuentaRegresiva.textContent = tiempo;
      
      if (tiempo === 0) {
        clearInterval(intervalo);
        disipando = true;
        canvas.style.opacity = 0;
        sistemaOnline.style.opacity = 1;
      }
    }
    
    intervalo = setInterval(cuentaRegresivaFuncion, 1000);
    
    function animarHumo() {
      generarHumo();
      requestAnimationFrame(animarHumo);
    }
    
    animarHumo();
  </script>
</html>
