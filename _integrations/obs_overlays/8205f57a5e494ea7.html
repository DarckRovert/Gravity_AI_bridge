<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: rgba(0,0,0,0);
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  .bailarina {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  }
  .brazo-izquierdo {
    position: absolute;
    top: 50%;
    left: 20%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 50px;
    height: 50px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    animation: brazo-izquierdo 2s infinite;
  }
  .brazo-derecho {
    position: absolute;
    top: 50%;
    right: 20%;
    transform: translate(50%, -50%) rotate(-45deg);
    width: 50px;
    height: 50px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    animation: brazo-derecho 2s infinite;
  }
  .pierna-izquierda {
    position: absolute;
    bottom: 20%;
    left: 20%;
    transform: translate(-50%, 50%) rotate(45deg);
    width: 50px;
    height: 50px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    animation: pierna-izquierda 2s infinite;
  }
  .pierna-derecha {
    position: absolute;
    bottom: 20%;
    right: 20%;
    transform: translate(50%, 50%) rotate(-45deg);
    width: 50px;
    height: 50px;
    background-color: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    animation: pierna-derecha 2s infinite;
  }
  @keyframes brazo-izquierdo {
    0% {
      transform: translate(-50%, -50%) rotate(45deg);
    }
    50% {
      transform: translate(-50%, -50%) rotate(90deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(45deg);
    }
  }
  @keyframes brazo-derecho {
    0% {
      transform: translate(50%, -50%) rotate(-45deg);
    }
    50% {
      transform: translate(50%, -50%) rotate(-90deg);
    }
    100% {
      transform: translate(50%, -50%) rotate(-45deg);
    }
  }
  @keyframes pierna-izquierda {
    0% {
      transform: translate(-50%, 50%) rotate(45deg);
    }
    50% {
      transform: translate(-50%, 50%) rotate(90deg);
    }
    100% {
      transform: translate(-50%, 50%) rotate(45deg);
    }
  }
  @keyframes pierna-derecha {
    0% {
      transform: translate(50%, 50%) rotate(-45deg);
    }
    50% {
      transform: translate(50%, 50%) rotate(-90deg);
    }
    100% {
      transform: translate(50%, 50%) rotate(-45deg);
    }
  }
</style>
</head>
<body>
  <div class="bailarina">
    <div class="brazo-izquierdo"></div>
    <div class="brazo-derecho"></div>
    <div class="pierna-izquierda"></div>
    <div class="pierna-derecha"></div>
  </div>
  <script>
    // Simulación de datos dinámicos
    setInterval(() => {
      console.log("Bailarina está bailando...");
    }, 1000);
  </script>
</body>
</html>
