<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.text-3d {
  font-size: 48px;
  font-family: Arial;
  text-shadow: 2px 2px 4px #000, -2px -2px 4px #fff;
  animation: zoom-in 0.5s ease-out;
}

.name-rotate {
  font-size: 24px;
  font-family: Arial;
  animation: rotate-name 2s linear infinite;
}

@keyframes zoom-in {
  0% {
    transform: scale(0.1);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes rotate-name {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

.canvas-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.canvas {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div class="container">
  <div class="text-3d">NUEVA DONACIÓN</div>
  <div class="name-rotate" id="name">Juanito</div>
</div>
<div class="canvas-container">
  <canvas class="canvas" id="canvas"></canvas>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createParticle(x, y) {
  particles.push({
    x: x,
    y: y,
    vx: Math.random() * 2 - 1,
    vy: Math.random() * 2 - 1,
    radius: Math.random() * 2 + 1,
    color: 'gold'
  });
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];
    particle.x += particle.vx;
    particle.y += particle.vy;
    particle.vx *= 0.9;
    particle.vy *= 0.9;
    if (particle.radius < 0.1) {
      particles.splice(i, 1);
    } else {
      particle.radius *= 0.9;
    }
  }
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < particles.length; i++) {
    const particle = particles[i];
    ctx.beginPath();
    ctx.arc(particle.x, particle.y, particle.radius, 0, 2 * Math.PI);
    ctx.fillStyle = particle.color;
    ctx.fill();
  }
}

function animate() {
  updateParticles();
  drawParticles();
  requestAnimationFrame(animate);
}

function triggerDonationAlert() {
  particles = [];
  for (let i = 0; i < 100; i++) {
    createParticle(canvas.width / 2, canvas.height / 2);
  }
  const names = ['Juanito', 'Pedro', 'Maria', 'Luis', 'Ana'];
  document.getElementById('name').innerText = names[Math.floor(Math.random() * names.length)];
}

setInterval(triggerDonationAlert, 10000);
animate();
</script>
</html>
