<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: rgba(0,0,0,0);
  margin: 0;
  padding: 0;
  overflow: hidden;
}
.hud-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: monospace;
  color: #00FF00;
  text-shadow: 0 0 10px #00FF00;
}
.time-display {
  font-size: 48px;
  font-weight: bold;
  margin-bottom: 20px;
}
.system-monitor {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.progress-bar {
  width: 200px;
  height: 20px;
  background-color: #333;
  border: 1px solid #444;
  margin-bottom: 10px;
}
.progress-bar-fill {
  height: 100%;
  background-color: #00FF00;
  animation: fluctuate 2s infinite;
}
@keyframes fluctuate {
  0% {
    width: 50%;
  }
  50% {
    width: 70%;
  }
  100% {
    width: 50%;
  }
}
.radar {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 2px solid #00FF00;
  animation: rotate 5s linear infinite;
}
.radar-dot {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: #00FF00;
  animation: pulse 1s infinite;
}
@keyframes rotate {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}
@keyframes pulse {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
  100% {
    opacity: 1;
  }
}
</style>
</head>
<body>
<div class="hud-container">
  <div class="time-display" id="time-display"></div>
  <div class="system-monitor">
    <div class="progress-bar">
      <div class="progress-bar-fill" style="width: 50%;"></div>
      <span>CPU: <span id="cpu-usage">50%</span></span>
    </div>
    <div class="progress-bar">
      <div class="progress-bar-fill" style="width: 30%;"></div>
      <span>RAM: <span id="ram-usage">30%</span></span>
    </div>
  </div>
  <div class="radar">
    <div class="radar-dot"></div>
  </div>
</div>
<script>
let timeDisplay = document.getElementById('time-display');
let cpuUsage = document.getElementById('cpu-usage');
let ramUsage = document.getElementById('ram-usage');
let cpuProgressBar = document.querySelector('.progress-bar-fill:first-child');
let ramProgressBar = document.querySelector('.progress-bar-fill:last-child');

setInterval(() => {
  let currentTime = new Date();
  let hours = currentTime.getHours().toString().padStart(2, '0');
  let minutes = currentTime.getMinutes().toString().padStart(2, '0');
  let seconds = currentTime.getSeconds().toString().padStart(2, '0');
  timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;
  
  let newCpuUsage = Math.floor(Math.random() * 100);
  cpuUsage.textContent = `${newCpuUsage}%`;
  cpuProgressBar.style.width = `${newCpuUsage}%`;
  
  let newRamUsage = Math.floor(Math.random() * 100);
  ramUsage.textContent = `${newRamUsage}%`;
  ramProgressBar.style.width = `${newRamUsage}%`;
}, 1000);
</script>
</html>
