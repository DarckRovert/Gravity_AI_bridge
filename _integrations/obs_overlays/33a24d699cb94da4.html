<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: rgba(0,0,0,0);
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  .enana-bailarina {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    background-color: #333;
    border-radius: 50%;
    animation: bailar 2s infinite;
  }
  .enana-bailarina::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background-color: #666;
    border-radius: 50%;
    animation: girar 1s infinite;
  }
  .enana-bailarina::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background-color: #999;
    border-radius: 50%;
    animation: parpadear 0.5s infinite;
  }
  @keyframes bailar {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  @keyframes girar {
    0% {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }
  @keyframes parpadear {
    0% {
      opacity: 1;
    }
    50% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
  .texto {
    position: absolute;
    top: 10px;
    left: 10px;
    font-family: Arial;
    font-size: 24px;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="enana-bailarina"></div>
  <div class="texto" id="texto"></div>
  <script>
    let texto = document.getElementById("texto");
    let mensajes = ["¡Hola!", "Estoy bailando", "Soy una enana bailarina"];
    let indice = 0;
    setInterval(() => {
      texto.textContent = mensajes[indice];
      indice = (indice + 1) % mensajes.length;
    }, 2000);
  </script>
</body>
</html>
